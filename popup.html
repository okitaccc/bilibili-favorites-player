<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>B站收藏夹播放器</title>
<style>
  :root { font: 13px "Microsoft YaHei UI", system-ui, sans-serif; color: #18191c; --page: #f3f4f6; --panel: #fff; --soft: #f7f7f8; --line: #cfd3d8; --text: #20242a; --muted: #6f7680; }
  :root[data-theme="dark"] { color: #f1f2f3; --page: #101217; --panel: #1b1e24; --soft: #25282f; --line: #4a4f59; --text: #f4f5f6; --muted: #bdc2ca; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { width: 560px; margin: 0; background: var(--page); }
  html.standalone body { width: 100vw; min-width: 560px; overflow: hidden; }
  html.standalone .player { width: 100%; }
  .player { padding: 16px 18px 12px; border-top: 2px solid #fb7299; background: var(--panel); }
  .main { display: grid; grid-template-columns: 210px 1fr 168px; gap: 10px; align-items: center; }
  .song { display: grid; grid-template-columns: 54px 1fr; gap: 11px; align-items: center; min-width: 0; }
  #cover { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; background: #eef0f2; animation: spin 14s linear infinite; animation-play-state: paused; }
  body.playing #cover { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #cover { animation: none; } }
  .meta { min-width: 0; }
  #title { display: -webkit-box; overflow: hidden; color: var(--text); font-size: 13px; font-weight: 600; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  #position { margin-top: 6px; color: var(--muted); font: 11px ui-monospace, monospace; }
  .transport { display: flex; justify-content: center; align-items: center; gap: 12px; }
  button { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; font-size: 17px; font-weight: 700; }
  button:hover { background: #f1f2f3; color: #fb7299; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #00aeec; outline-offset: 2px; }
  #toggle { width: 46px; height: 46px; padding-left: 3px; background: #fb7299; color: white; font-size: 20px; box-shadow: 0 5px 14px #fb729944; }
  .tools { display: flex; justify-content: flex-end; gap: 4px; }
  .tools button { border: 1.5px solid var(--line); border-radius: 9px; font-size: 15px; }
  .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-shuffle, .icon-sun, .icon-pause { display: none; }
  #mode[data-mode="shuffle"] .icon-repeat, :root[data-theme="dark"] #theme .icon-moon, #toggle[data-paused="false"] .icon-play { display: none; }
  #mode[data-mode="shuffle"] .icon-shuffle, :root[data-theme="dark"] #theme .icon-sun, #toggle[data-paused="false"] .icon-pause { display: block; }
  .timeline { display: grid; grid-template-columns: 38px minmax(120px, 1fr) 38px 18px 76px; gap: 8px; align-items: center; margin: 10px 0 12px 65px; color: var(--muted); font: 10px ui-monospace, monospace; }
  #progress, #volume { width: 100%; height: 5px; accent-color: #fb7299; cursor: pointer; }
  .volume-icon { width: 17px; height: 17px; }
  .library { display: grid; grid-template-columns: 1fr 1.5fr; gap: 9px; padding-top: 11px; border-top: 1px solid var(--line); }
  select { min-width: 0; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--text); font-weight: 500; }
  #status { min-height: 15px; margin: 7px 2px 0; color: var(--muted); font-size: 11px; }
</style>
<main class="player">
  <div class="main">
    <div class="song">
      <img id="cover" alt="视频封面">
      <div class="meta"><div id="title">还没有播放歌曲</div><div id="position">0 / 0</div></div>
    </div>
    <div class="transport">
      <button id="prev" title="上一首" aria-label="上一首"><svg class="icon" viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16Z"/><path d="M5 19V5"/></svg></button>
      <button id="toggle" data-paused="true" title="播放" aria-label="播放"><svg class="icon icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg><svg class="icon icon-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
      <button id="next" title="下一首" aria-label="下一首"><svg class="icon" viewBox="0 0 24 24"><path d="m5 4 10 8-10 8V4Z"/><path d="M19 5v14"/></svg></button>
    </div>
    <div class="tools">
      <button id="mode" data-mode="loop" title="列表循环" aria-label="切换播放模式"><svg class="icon icon-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg><svg class="icon icon-shuffle" viewBox="0 0 24 24"><path d="m18 4 3 3-3 3"/><path d="M3 7h4c5 0 5 10 10 10h4"/><path d="m18 14 3 3-3 3"/><path d="M3 17h4c1.5 0 2.6-.9 3.5-2"/></svg></button>
      <button id="reload" title="刷新收藏夹" aria-label="刷新收藏夹"><svg class="icon" viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M19 16a8 8 0 1 1-1-9l2 5"/></svg></button>
      <button id="theme" title="切换夜间模式" aria-label="切换日间或夜间模式"><svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg><svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button id="pin" title="锁定为独立窗口" aria-label="锁定为独立窗口"><svg class="icon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </div>
  <div class="timeline">
    <span id="current">00:00</span>
    <input id="progress" type="range" min="0" max="100" value="0" aria-label="播放进度">
    <span id="duration">00:00</span>
    <svg class="icon volume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量">
  </div>
  <div class="library">
    <select id="folder" aria-label="收藏夹"><option>正在读取收藏夹…</option></select>
    <select id="track" aria-label="从指定曲目开始"><option>选择一首开始播放</option></select>
  </div>
  <div id="status"></div>
</main>
<script src="popup.js"></script>
</html>
